name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xep file vao thu muc
        run: |
                    unzip -o "$(find . -name '*flat*.zip' -not -path './.git/*' | head -1)" -d flat
          mkdir -p proj/app/src/main/java/com/dlsbot proj/app/src/main/res/values proj/app/src/main/res/xml
          cd flat
          cp settings.gradle.kts build.gradle.kts ../proj/
          cp app-build.gradle.kts ../proj/app/build.gradle.kts
          cp AndroidManifest.xml ../proj/app/src/main/
          cp strings.xml ../proj/app/src/main/res/values/
          cp accessibility.xml ../proj/app/src/main/res/xml/
          cp MainActivity.kt BotService.kt ../proj/app/src/main/java/com/dlsbot/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with: { name: dls-bot-apk, path: proj/app/build/outputs/apk/debug/app-debug.apk }
